services:
  - type: web
    name: flywheel-backend
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    # Runs after build but with the persistent disk already mounted (unlike buildCommand,
    # which runs before the disk exists — that mismatch is what broke the original deploy:
    # migrate tried to open /var/data/db.sqlite3 during build and got "unable to open
    # database file" since /var/data didn't exist yet).
    # seed_demo no-ops once the demo data exists, so this is safe on every deploy —
    # it only populates the empty disk on first boot. Use `seed_demo --force` from a
    # shell to deliberately reset the demo back to its seeded state.
    preDeployCommand: python manage.py migrate && python manage.py seed_demo
    startCommand: gunicorn flywheel.wsgi
    # Persists db.sqlite3 and uploaded media across deploys/restarts — Free-instance
    # services can't attach disks at all, which is why this is on Starter ($7/mo).
    disk:
      name: flywheel-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      # Where the persistent disk above is mounted — settings.py puts db.sqlite3 and
      # media/ under this path instead of BASE_DIR when it's set.
      - key: DATA_DIR
        value: /var/data
      # Extra allowed hosts beyond the service's own *.onrender.com domain (which
      # settings.py already whitelists automatically via RENDER_EXTERNAL_HOSTNAME).
      # Comma-separated, e.g. "flywheel.example.com".
      - key: ALLOWED_HOSTS
        value: ""
      # Not needed for the frontend service below — its /api/* rewrite proxy makes
      # those requests same-origin from the browser's perspective. Only set this if
      # something else (a custom domain, local tooling, etc.) calls the API directly
      # cross-origin, e.g. "https://flywheel.example.com" (comma-separated for multiple).
      - key: CORS_ALLOWED_ORIGINS
        value: ""

  - type: web
    name: flywheel
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    # The frontend's own code calls relative paths like fetch('/api/...') — it has
    # no separate "backend URL" config (that's what makes Vite's dev proxy work
    # locally). These rewrites proxy those same paths to the backend service in
    # production, so the browser sees everything as same-origin (no CORS needed).
    # IMPORTANT: these are the backend's real assigned hostname, NOT its service
    # name. "flywheel-backend.onrender.com" was already taken by an unrelated
    # service, so Render assigned the "-2tnw" suffix; pointing these at the bare
    # name proxies /api/* to a stranger's server. Re-check after any change that
    # could reassign the hostname.
    routes:
      - type: rewrite
        source: /api/*
        destination: https://flywheel-backend-2tnw.onrender.com/api/*
      - type: rewrite
        source: /media/*
        destination: https://flywheel-backend-2tnw.onrender.com/media/*
      - type: rewrite
        source: /*
        destination: /index.html
